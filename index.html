<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123a35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>益生菌产品 · 方案费用收益看板</title>
  <style>
    :root{--ink:#17332e;--green:#1c5b50;--mint:#e9f2ee;--gold:#b98c49;--paper:#fffdf9;--line:#dce4df;--muted:#68756f;--red:#b44335;--shadow:0 8px 30px rgba(21,52,45,.09)}
    *{box-sizing:border-box} body{margin:0;background:#f5f6f3;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select,textarea{font:inherit} button{cursor:pointer;border:0} .shell{max-width:980px;margin:auto;padding:22px 18px 48px}
    header{background:linear-gradient(125deg,#123a35,#1d6255);color:white;border-radius:20px;padding:25px 24px 20px;box-shadow:var(--shadow)}
    .eyebrow{font-size:12px;letter-spacing:.13em;opacity:.72}.topline{display:flex;justify-content:space-between;gap:16px;align-items:start}h1{font-size:24px;margin:5px 0 5px;letter-spacing:.02em}.sub{margin:0;opacity:.8;font-size:13px}.header-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.mode{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:9px 12px;white-space:nowrap}.mode.secondary{background:transparent}
    .tabs{display:flex;gap:9px;overflow:auto;padding:18px 1px 3px;scrollbar-width:none}.tab{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:650}.tab.active{background:var(--green);color:white;border-color:var(--green)}
    .panel{background:var(--paper);border-radius:18px;padding:20px;margin-top:18px;box-shadow:var(--shadow)}.overview{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px}.metric{background:var(--mint);border-radius:12px;padding:13px}.metric .label{font-size:12px;color:var(--muted)}.metric .number{font-size:22px;font-weight:750;margin-top:2px}.metric.negative{background:#fbedeb}.metric.negative .number{color:var(--red)}
    .summary{font-size:13px;color:var(--muted);margin:0 0 18px}.toolbar{display:flex;gap:9px;justify-content:space-between;margin-bottom:12px;align-items:center}.toolbar .left{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:8px 11px;font-size:13px}.btn.primary{border-color:var(--green);background:var(--green);color:#fff}.btn.warn{color:var(--red);border-color:#e8beb9}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}.cost-table{width:100%;border-collapse:collapse;min-width:620px}.cost-table th{text-align:left;font-size:12px;font-weight:600;color:#68756f;background:#f5f7f5;padding:11px 12px}.cost-table td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}.cost-table tr.total td{font-weight:750;background:#f5faf7}.cost-table tr.margin td{font-size:16px;font-weight:750;background:#edf5f0}.cost-table tr.margin.negative td{background:#fbedeb;color:var(--red)}.cost-table td:nth-child(3),.cost-table td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums}.edit-field{border:1px solid #bccbc3;background:#fff;border-radius:7px;padding:6px;width:100%;min-width:88px;color:var(--ink)}.small-select{min-width:84px}.row-delete{color:var(--red);background:transparent;font-size:18px}.note{border-left:3px solid var(--gold);background:#fff8e9;padding:11px 12px;border-radius:0 9px 9px 0;margin-top:16px;font-size:13px;color:#6e5b37}.source-warning{margin-top:10px;padding:10px 12px;border-radius:9px;background:#fbedeb;color:#813d35;font-size:13px}.hidden{display:none!important}.footer-tools{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:15px}.status{font-size:12px;color:var(--muted)}
    @media(max-width:600px){.shell{padding:14px 12px 35px}header{padding:20px 17px 16px;border-radius:16px}h1{font-size:21px}.topline{gap:8px}.mode{padding:8px;font-size:12px}.panel{padding:14px;border-radius:14px;margin-top:14px}.overview{gap:8px}.metric{padding:10px}.metric .number{font-size:17px}.toolbar{align-items:start}.toolbar .left{max-width:130px}.actions{justify-content:flex-end}.btn{padding:7px 9px}.footer-tools{align-items:start;flex-direction:column}.cost-table th,.cost-table td{padding:9px 10px}}
    @media print{body{background:white}.shell{max-width:none;padding:0}header,.tabs,.toolbar,.footer-tools,.source-warning{display:none}.panel{box-shadow:none;margin:0;padding:0}.table-wrap{overflow:visible;border:0}.cost-table{min-width:0}.note{margin-top:12px}}
  </style>
</head>
<body>
<main class="shell">
  <header><div class="topline"><div><div class="eyebrow">PROBIOTIC PRODUCT PLANNING</div><h1>益生菌产品 · 方案费用收益看板</h1><p class="sub">手机查看 · 统一对比 · 随时调整</p></div><div class="header-actions"><button id="installBtn" class="mode secondary">保存到手机</button><button id="modeBtn" class="mode">进入编辑</button></div></div></header>
  <nav id="tabs" class="tabs" aria-label="方案选择"></nav>
  <section class="panel">
    <div id="overview" class="overview"></div><p id="description" class="summary"></p>
    <div class="toolbar"><div class="left" id="tableTitle"></div><div class="actions"><button class="btn" id="shareBtn">生成分享图</button><button class="btn edit-only hidden" id="addPlanBtn">新增方案</button><button class="btn warn edit-only hidden" id="deletePlanBtn">删除当前方案</button><button class="btn primary hidden" id="addBtn">添加项目</button></div></div>
    <div class="table-wrap"><table class="cost-table"><thead><tr><th>项目</th><th>计算方式</th><th>金额（元）</th><th>占售价比例</th><th class="edit-only hidden">操作</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div id="note" class="note"></div><div id="sourceWarning" class="source-warning hidden"></div>
    <div class="footer-tools"><span id="status" class="status">数据保存在本机浏览器中</span><div class="actions edit-only hidden"><button class="btn" id="resetBtn">恢复初始数据</button><button class="btn primary" id="saveBtn">保存修改</button></div></div>
  </section>
</main>
<script>
const initialPlans=[
 {id:'base',name:'达人带货方案',description:'定价 298 元/包。扣除渠道及运营费用后的毛利分析，产品成本另计。',note:'产品成本尚未计入，最终净利润 = 毛利 − 产品成本。',priceLabel:'售价',price:298,items:[['达人带货','rate',.30],['平台费','rate',.05],['业务推广','fixed',10],['快递费','fixed',15],['隐形费用','fixed',15],['共同奖金','fixed',5],['地区提成','fixed',10],['其他费用','fixed',5],['三方运营','fixed',3]]},
 {id:'professional',name:'头部达人方案',description:'定价 298 元/包。含头部达人费用的费用结构，产品成本另计。',note:'产品成本尚未计入，最终净利润 = 毛利 − 产品成本；头部达人费用为原表新增项。',priceLabel:'售价',price:298,items:[['头部达人费用','rate',.40],['平台费','rate',.05],['业务推广','fixed',10],['快递费','fixed',15],['隐形费用','fixed',15],['共同奖金','fixed',5],['地区提成','fixed',10],['其他费用','fixed',5],['三方运营','fixed',3]]},
 {id:'distribution',name:'小程序分销方案',description:'定价 298 元/包。小程序推广与二级分销方案，产品成本、头部达人费用和流量投入另计。',note:'原表说明称三项 30% 比例项叠加已达售价 90%，但明细仅显示一级分销 30%、二级分销 10%。请确认后可直接在编辑模式修改。',priceLabel:'售价',price:298,items:[['一级分销','rate',.30],['二级分销','rate',.10],['平台费','rate',.05],['业务推广','fixed',10],['快递费','fixed',15],['隐形费用','fixed',15],['共同奖金','fixed',5],['其他费用','fixed',5],['三方运营','fixed',3]]},
 {id:'agent',name:'代理商模式',description:'代理商提货价 138 元/包，已含运费。为公司方在代理渠道下的毛利分析，产品成本另计。',note:'提货价已含运费，渠道内不再单列快递费；试用装成本按 6 元 × 20% 计算；产品自身成本尚未计入。',priceLabel:'代理商提货价（含运费）',price:138,items:[['业务提成','fixed',5],['运营费','fixed',5],['试用装成本','fixed',1.2]]}
].map(p=>({...p,items:p.items.map(([name,type,value])=>({name,type,value}))}));
let plans=JSON.parse(localStorage.getItem('probiotic-plans-v2')||'null')||structuredClone(initialPlans);let selected=plans[0].id,editing=false;
const money=n=>new Intl.NumberFormat('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n); const pct=n=>(n*100).toFixed(n*100%1?1:0)+'%';
function plan(){return plans.find(p=>p.id===selected)}function cost(p){return p.items.reduce((s,x)=>s+(x.type==='rate'?p.price*x.value:x.value),0)}
 function render(){let p=plan(),total=cost(p),margin=p.price-total,ratio=margin/p.price;document.querySelectorAll('.edit-only').forEach(x=>x.classList.toggle('hidden',!editing));addBtn.classList.toggle('hidden',!editing);deletePlanBtn.disabled=plans.length===1;deletePlanBtn.title=plans.length===1?'至少保留一个方案':'';modeBtn.textContent=editing?'退出编辑':'进入编辑';
 tabs.innerHTML=plans.map(x=>`<button class="tab ${x.id===selected?'active':''}" data-id="${x.id}">${x.name}</button>`).join('');
 overview.innerHTML=`<div class="metric"><div class="label">${p.priceLabel}</div><div class="number">¥ ${money(p.price)}</div></div><div class="metric"><div class="label">费用合计</div><div class="number">¥ ${money(total)}</div></div><div class="metric ${margin<0?'negative':''}"><div class="label">剩余毛利（未扣产品成本）</div><div class="number">¥ ${money(margin)} · ${pct(ratio)}</div></div>`;
 description.textContent=p.description;tableTitle.innerHTML=editing?`<input class="edit-field" id="planNameInput" value="${p.name}" aria-label="方案名称">`:`${p.name} · 每包费用明细`;
 let h=editing?`<tr class="total"><td>${input('priceName',p.priceLabel,'项目')}</td><td>—</td><td>${input('price',p.price,'number')}</td><td>100%</td><td></td></tr>`:`<tr class="total"><td>${p.priceLabel}</td><td>—</td><td>¥ ${money(p.price)}</td><td>100%</td></tr>`;
 p.items.forEach((x,i)=>{let v=x.type==='rate'?p.price*x.value:x.value;h+=editing?`<tr><td>${input('name',x.name,'text',i)}</td><td><select class="edit-field small-select" data-field="type" data-i="${i}"><option value="rate" ${x.type==='rate'?'selected':''}>比例</option><option value="fixed" ${x.type==='fixed'?'selected':''}>固定</option></select></td><td>${x.type==='rate'?input('value',x.value*100,'number',i):input('value',x.value,'number',i)}</td><td>${pct(v/p.price)}</td><td><button class="row-delete" data-delete="${i}" aria-label="删除项目">×</button></td></tr>`:`<tr><td>${x.name}</td><td>${x.type==='rate'?pct(x.value):'固定'}</td><td>¥ ${money(v)}</td><td>${pct(v/p.price)}</td></tr>`});
 h+=`<tr class="total"><td>费用合计</td><td>—</td><td>¥ ${money(total)}</td><td>${pct(total/p.price)}</td>${editing?'<td></td>':''}</tr><tr class="margin ${margin<0?'negative':''}"><td>剩余（毛利，未扣产品成本）</td><td>${p.priceLabel} − 费用合计</td><td>¥ ${money(margin)}</td><td>${pct(ratio)}</td>${editing?'<td></td>':''}</tr>`;rows.innerHTML=h;note.textContent=p.note;sourceWarning.textContent=p.warning||'';sourceWarning.classList.toggle('hidden',!p.warning);status.textContent=editing?'修改会即时计算，点击“保存修改”后保存在本机浏览器。':'数据保存在本机浏览器中。领导查看时不需要编辑。';}
function input(field,value,type,i=''){return `<input class="edit-field" data-field="${field}" data-i="${i}" type="${type}" value="${value}">`}
tabs.onclick=e=>{let id=e.target.dataset.id;if(id){selected=id;render()}};modeBtn.onclick=()=>{editing=!editing;render()};
rows.oninput=e=>{let el=e.target,field=el.dataset.field;if(!field)return;let p=plan(),i=el.dataset.i;if(field==='price'){p.price=Number(el.value)||0}else if(field==='priceName'){p.priceLabel=el.value}else if(i!==''){let item=p.items[Number(i)];item[field]=field==='value'?(item.type==='rate'?(Number(el.value)||0)/100:Number(el.value)||0):el.value}render()};
rows.onchange=e=>{let el=e.target;if(el.dataset.field==='type'){let p=plan(),x=p.items[Number(el.dataset.i)],amount=x.type==='rate'?p.price*x.value:x.value;x.type=el.value;x.value=x.type==='rate'?amount/p.price:amount;render()}};
rows.onclick=e=>{let i=e.target.dataset.delete;if(i!==undefined){plan().items.splice(Number(i),1);render()}};addBtn.onclick=()=>{plan().items.push({name:'新项目',type:'fixed',value:0});render()};
document.addEventListener('input',e=>{if(e.target.id==='planNameInput'){plan().name=e.target.value||'未命名方案';tabs.innerHTML=plans.map(x=>`<button class="tab ${x.id===selected?'active':''}" data-id="${x.id}">${x.name}</button>`).join('')}});
addPlanBtn.onclick=()=>{let number=plans.length+1,newPlan={id:'plan-'+Date.now(),name:'新方案 '+number,description:'请在编辑模式填写方案说明、售价和费用项目。',note:'产品成本尚未计入，最终净利润 = 毛利 − 产品成本。',priceLabel:'售价',price:0,items:[]};plans.push(newPlan);selected=newPlan.id;render()};
deletePlanBtn.onclick=()=>{if(plans.length===1)return;let p=plan();if(confirm(`确定删除“${p.name}”吗？`)){let index=plans.findIndex(x=>x.id===selected);plans.splice(index,1);selected=plans[Math.max(0,index-1)].id;render()}};
saveBtn.onclick=()=>{localStorage.setItem('probiotic-plans-v2',JSON.stringify(plans));status.textContent='已保存到本机浏览器。';};resetBtn.onclick=()=>{if(confirm('确定恢复为 Excel 初始数据？已保存的修改会清除。')){plans=structuredClone(initialPlans);localStorage.removeItem('probiotic-plans-v2');selected=plans[0].id;render()}};
let deferredInstall;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;installBtn.classList.remove('hidden')});installBtn.onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;installBtn.classList.add('hidden')}else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){alert('请点击浏览器“分享”按钮，再选择“添加到主屏幕”。')}else{alert('网站发布后，可在浏览器菜单中选择“安装应用”或“添加到主屏幕”。')}};if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js');render();
</script></body></html>
